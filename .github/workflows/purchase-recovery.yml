name: Paid purchase recovery validation
on:
  push:
    branches: [chatgpt/purchase-recovery-0.1.33]
    paths: ['.github/workflows/purchase-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact checked source and delivered-asset fixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('tools/purchase-recovery')
          packed=''.join(p.read_text().strip() for p in sorted(root.glob('payload.xz.b64.*')))
          decoded=lzma.decompress(base64.b64decode(packed,validate=True))
          assert hashlib.sha256(decoded).hexdigest()=='692c1cdbc88d6cbb7252d1891d957f13cadc794a15db9095099f2f5b2dc2dc0b'
          payload=json.loads(decoded)
          patch=pathlib.Path('/tmp/paid-recovery.patch');patch.write_text(payload['patch'])
          if not pathlib.Path('src/main/java/com/quin/catancraft/world/PaidConstructionRecovery.java').exists():
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
              data=gzip.compress(payload['fixture'].encode(),compresslevel=9,mtime=0)
              assert hashlib.sha256(data).hexdigest()=='84d7095b0b3a50b6c02f8175309436c78ed9077b02cfac854f10e5e7f6f70ec3'
              dest=pathlib.Path('src/main/resources/data/catancraft_paid_recovery/fixtures/r5_contracts.b64');dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(base64.b64encode(data).decode()+'\n')
          PY
          git diff --check
          git config user.name 'quintaneous'
          git config user.email '145784746+quintaneous@users.noreply.github.com'
          git add -- build.gradle src
          if ! git diff --cached --quiet; then
            git commit -m 'Recover original paid civic and prestige transactions with durable receipts and immutable-history companions'
            git push origin HEAD:refs/heads/chatgpt/purchase-recovery-0.1.33
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        suite:
          - {ns: catancraft_paid_recovery, count: 19}
          - {ns: catancraft, count: 50}
          - {ns: catancraft_integration, count: 12}
          - {ns: catancraft_economy_clock, count: 9}
          - {ns: catancraft_base_lifecycle, count: 8}
          - {ns: catancraft_chunk_lifecycle, count: 6}
          - {ns: catancraft_public27, count: 11}
          - {ns: catancraft_houses, count: 11}
          - {ns: catancraft_wall_gui, count: 8}
          - {ns: catancraft_sectors_service, count: 15}
          - {ns: catancraft_sector_prices, count: 7}
          - {ns: catancraft_producer_r2, count: 9}
          - {ns: catancraft_defense, count: 8}
          - {ns: catancraft_sectors, count: 22}
          - {ns: catancraft_sectors_natural, count: 7}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile exact committed source
        run: |
          set -o pipefail
          mkdir -p build/paid-recovery-evidence
          git rev-parse HEAD > build/paid-recovery-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/paid-recovery-evidence/source.zip
          gradle build -PreleaseCommit=$(git rev-parse HEAD) --no-daemon --max-workers=4 2>&1 | tee build/paid-recovery-evidence/build.log
          sha256sum build/libs/*.jar > build/paid-recovery-evidence/JAR_SHA256.txt
      - name: Download test assets with bounded network-only retry
        run: |
          for attempt in 1 2 3; do
            gradle downloadAssets --daemon --max-workers=4 > build/paid-recovery-evidence/assets-$attempt.log 2>&1 && exit 0
          done
          cat build/paid-recovery-evidence/assets-3.log
          exit 1
      - name: Native tests with exact count and no test retry
        env:
          NS: ${{ matrix.suite.ns }}
          COUNT: ${{ matrix.suite.count }}
        run: |
          set -uo pipefail
          dest=build/$NS-run/config/catancraft/schematics
          if [ "$NS" = catancraft ]; then dest=build/gametest-run/config/catancraft/schematics; fi
          if [ "$NS" = catancraft_public27 ]; then dest=build/public-gametest-run/config/catancraft/schematics; fi
          mkdir -p "$dest"
          cp tests/fixtures/thall4.schem tests/fixtures/thall5.schem "$dest/"
          status=0
          timeout 1400s gradle runGameTestServer -PgameTestNamespace="$NS" --daemon --max-workers=4 > build/paid-recovery-evidence/$NS.log 2>&1 || status=$?
          echo "$status" > build/paid-recovery-evidence/$NS.exit
          cat build/paid-recovery-evidence/$NS.log
          test "$status" = 0 && grep -Fq "$COUNT GAME TESTS COMPLETE" build/paid-recovery-evidence/$NS.log && grep -Fq "All $COUNT required tests passed" build/paid-recovery-evidence/$NS.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-recovery-${{ matrix.suite.ns }}
          path: |
            build/libs/*.jar
            build/paid-recovery-evidence/
          if-no-files-found: error
