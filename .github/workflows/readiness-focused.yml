name: Focused automatic-city readiness diagnostic
on:
  push:
    branches: [chatgpt/readiness-diagnostic-0.1.31]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build unchanged runtime with readiness observer
        run: |
          set -o pipefail
          mkdir -p build/probe-evidence
          git rev-parse HEAD > build/probe-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/probe-evidence/source.zip
          gradle build -PreleaseCommit=$(git rev-parse HEAD) --no-daemon --max-workers=4 2>&1 | tee build/probe-evidence/build.log
      - name: Rerun only failed lifecycle namespace with passive observer
        run: |
          set -o pipefail
          mkdir -p build/catancraft_chunk_lifecycle-run/config/catancraft/schematics
          cp tests/fixtures/thall4.schem tests/fixtures/thall5.schem build/catancraft_chunk_lifecycle-run/config/catancraft/schematics/
          timeout 480s gradle runGameTestServer -PgameTestNamespace=catancraft_chunk_lifecycle --daemon --max-workers=4 2>&1 | tee build/probe-evidence/native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-diagnostic
          path: |
            build/libs/*.jar
            build/probe-evidence/
