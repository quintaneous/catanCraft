# Run3: recognize native empty/unpadded region storage with strict payload validation.
name: Vehicle47 native recovery and pickup exits
on:
  push:
    branches: [chatgpt/combined-shop-acceptance]
    paths: ['.github/workflows/vehicle47-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vehicle47-evidence
          git rev-parse HEAD > build/vehicle47-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/vehicle47-evidence/source.zip
          gradle build -PreleaseCommit="$GITHUB_SHA" --no-daemon --max-workers=4 2>&1 | tee build/vehicle47-evidence/build.log
          sha256sum build/libs/*.jar > build/vehicle47-evidence/JAR_SHA256.txt
      - name: Fetch game assets
        shell: bash
        run: |
          for attempt in 1 2 3; do
            gradle downloadAssets --daemon --max-workers=4 > build/vehicle47-evidence/assets-$attempt.log 2>&1 && exit 0
          done
          cat build/vehicle47-evidence/assets-3.log
          exit 1
      - name: Prepare pinned native SBW inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sec01_035/prepare_runtime.py --root build/sec01-035-runtime > build/vehicle47-evidence/runtime-prepare.json
          python3 tools/sec01_035/prepare_runtime.py --root build/sec01-035-runtime --verify-only > build/vehicle47-evidence/runtime-verify.json
          cp build/sec01-035-runtime/runtime-artifacts.json build/sec01-035-runtime/download-provenance.json build/vehicle47-evidence/
      - name: Validate controlled native policies
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local ns="$1" count="$2" status=0
            local label="${LABEL:-$1}"
            shift 2
            timeout 600s gradle runGameTestServer -PcontrolledGameTests=true -PgameTestNamespace="$ns" "$@" --daemon --max-workers=4 > "build/vehicle47-evidence/$label.log" 2>&1 || status=$?
            echo "$status" > "build/vehicle47-evidence/$label.exit"
            echo "$count" > "build/vehicle47-evidence/$label.expected"
            cat "build/vehicle47-evidence/$label.log"
            test "$status" = 0
            grep -Fq "$count GAME TESTS COMPLETE" "build/vehicle47-evidence/$label.log"
            grep -Fq "All $count required tests passed" "build/vehicle47-evidence/$label.log"
          }
          run_check catancraft_vehicle47 4 -I tools/vehicle47/validate.gradle -Pvehicle47RestartSource="$GITHUB_SHA"
          LABEL=vehicle47_seed run_check catancraft_vehicle47_restart 1 -I tools/vehicle47/validate.gradle -Pvehicle47RestartPhase=seed -Pvehicle47RestartSource="$GITHUB_SHA"
          LABEL=vehicle47_verify run_check catancraft_vehicle47_restart 1 -I tools/vehicle47/validate.gradle -Pvehicle47RestartPhase=verify -Pvehicle47RestartSource="$GITHUB_SHA"
          run_check catancraft_vehicle47_exit 6 -I tools/vehicle47/validate.gradle
          run_check catancraft_vehicle46 18
          run_check catancraft_vehicle46_native 6 -I tools/vehicle46/validate.gradle
          run_check catancraft_sbw 7 -I tools/sec01_035/validate.gradle
          LABEL=procurement_seed run_check catancraft_sbw_procurement35 1 -I tools/sec01_035/validate.gradle -PsbwRestartPhase=seed
          LABEL=procurement_verify run_check catancraft_sbw_procurement35 1 -I tools/sec01_035/validate.gradle -PsbwRestartPhase=verify
          run_check catancraft_economy45 6
          run_check catancraft_vehicle45 8
          run_check catancraft_economy_clock 9
          run_check catancraft 50
      - name: Retain bounded journal evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/vehicle47-evidence/journals build/vehicle47-evidence/procurement
          if test -d build/controlled-catancraft_vehicle46-run/world/data/vehicle46-journal-tests; then
            cp -r build/controlled-catancraft_vehicle46-run/world/data/vehicle46-journal-tests/. build/vehicle47-evidence/journals/
          fi
          shopt -s nullglob
          for proof in build/controlled-catancraft_sbw_procurement35-run/world/data/catancraft_sec01_procurement35_*.dat; do
            cp "$proof" build/vehicle47-evidence/procurement/
          done
      - name: Retain native delivery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for ns in catancraft_vehicle47 catancraft_vehicle47_restart; do
            world="build/controlled-$ns-run/world"
            target="build/vehicle47-evidence/native/$ns"
            mkdir -p "$target"
            if test -d "$world/data"; then
              cp -r "$world/data" "$target/data"
            fi
            if test -d "$world/entities"; then
              cp -r "$world/entities" "$target/entities"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle47-source-and-evidence
          path: |
            build/vehicle47-evidence
            build/libs/*.jar
          if-no-files-found: error
