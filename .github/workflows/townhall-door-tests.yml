name: Town Hall door regression
on:
  push:
    branches: [v0.1-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and run actual Forge GameTests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          gradle build runGameTestServer --no-daemon 2>&1 | tee build/townhall-gametest-console.log
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: townhall-door-regression-evidence
          path: |
            build/townhall-gametest-console.log
            build/gametest-run/logs/
            src/main/java/com/quin/catancraft/world/TownHallInteractionPolicy.java
            src/main/java/com/quin/catancraft/world/TownHallPrestigeUpgradeService.java
            src/main/java/com/quin/catancraft/gametest/TownHallDoorTests.java
          if-no-files-found: error
