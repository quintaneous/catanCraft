name: Combined native validation (no publication)
on:
  workflow_dispatch:
  pull_request:
    branches: [v0.1-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and run every retained and combined namespace
        run: bash tools/validate_combined.sh build/combined-evidence
      - name: Preserve complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-validation
          path: |
            build/combined-evidence/
            build/libs/*.jar
          if-no-files-found: error
