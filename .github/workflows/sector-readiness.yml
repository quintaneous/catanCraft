name: Sector readiness verified delivery
on:
  push:
    branches: [chatgpt/sector-readiness-0.1.31]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 16e20e9b03fcc184142bcd7e8393b15694753a47
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build exact source shared with parallel retained regressions
        run: |
          set -o pipefail
          mkdir -p build/readiness-evidence
          git rev-parse HEAD > build/readiness-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/readiness-evidence/source.zip
          gradle build -PreleaseCommit=$(git rev-parse HEAD) --no-daemon --max-workers=4 2>&1 | tee build/readiness-evidence/build.log
          sha256sum build/libs/*.jar > build/readiness-evidence/JAR_SHA256.txt
      - name: Final lifecycle checks including true source-conflict refusal
        run: |
          set -uo pipefail
          ns=catancraft_chunk_lifecycle
          mkdir -p build/$ns-run/config/catancraft/schematics
          cp tests/fixtures/thall4.schem tests/fixtures/thall5.schem build/$ns-run/config/catancraft/schematics/
          status=0
          timeout 600s gradle runGameTestServer -PgameTestNamespace=$ns --daemon --max-workers=4 > build/readiness-evidence/$ns.log 2>&1 || status=$?
          echo "$status" > build/readiness-evidence/$ns.exit
          cat build/readiness-evidence/$ns.log
          test "$status" = 0 && grep -Fq '6 GAME TESTS COMPLETE' build/readiness-evidence/$ns.log && grep -Fq 'All 6 required tests passed' build/readiness-evidence/$ns.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-readiness-final
          path: |
            build/libs/*.jar
            build/readiness-evidence/
          if-no-files-found: error
