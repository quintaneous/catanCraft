name: Sector readiness verified delivery
on:
  push:
    branches: [chatgpt/sector-readiness-0.1.31]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct isolated fixture drift without changing production guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/quin/catancraft/world/ChunkLifecycleTests.java')
          s=p.read_text()
          if 'previousRandomTickSpeed' not in s:
              old='if(CityBasePreparation.isRunning(h.getLevel().getServer()))awaitPublic(h,f,ticks+1,done);else done.run();'
              assert old in s
              s=s.replace(old,'if(CityBasePreparation.isRunning(h.getLevel().getServer()))awaitPublic(h,f,ticks+1,done);else {f.finish();done.run();}')
              old='final Path path;final CompoundTag ledger=new CompoundTag();'
              assert old in s
              s=s.replace(old,old+'int previousRandomTickSpeed;')
              old='        void stage(){\n            var positions='
              assert old in s
              s=s.replace(old,'''        void stage(){
                      if(!(level().getServer() instanceof GameTestServer))throw new IllegalStateException("Synthetic fixture outside GameTest server");
                      // The sparse authored sample contains preserved grass under existing masonry.
                      // Freeze random vegetation ticks in THIS synthetic test world while asynchronous
                      // entity IO runs; production source/state validation remains exact and unchanged.
                      previousRandomTickSpeed=level().getGameRules().getInt(net.minecraft.world.level.GameRules.RULE_RANDOMTICKING);
                      level().getGameRules().getRule(net.minecraft.world.level.GameRules.RULE_RANDOMTICKING).set(0,level().getServer());
                      var positions=''')
              old='        public ServerLevel level(){return helper.getLevel();}'
              assert old in s
              s=s.replace(old,'''        void finish(){level().getGameRules().getRule(net.minecraft.world.level.GameRules.RULE_RANDOMTICKING).set(previousRandomTickSpeed,level().getServer());}
          '''+old)
              p.write_text(s)
          PY
          git config user.name 'CatanCraft validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/quin/catancraft/world/ChunkLifecycleTests.java
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze and restore random vegetation ticks only in sparse asynchronous GameTest fixture'
            git push origin HEAD:chatgpt/sector-readiness-0.1.31
          fi
          mkdir -p build/readiness-evidence
          git diff --name-only 16e20e9b03fcc184142bcd7e8393b15694753a47 -- src build.gradle > build/readiness-evidence/CHANGES_SINCE_RETAINED_NATIVE.txt
          test "$(cat build/readiness-evidence/CHANGES_SINCE_RETAINED_NATIVE.txt)" = 'src/main/java/com/quin/catancraft/world/ChunkLifecycleTests.java'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build exact runtime shared with retained regressions
        run: |
          set -o pipefail
          git rev-parse HEAD > build/readiness-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/readiness-evidence/source.zip
          gradle build -PreleaseCommit=$(git rev-parse HEAD) --no-daemon --max-workers=4 2>&1 | tee build/readiness-evidence/build.log
          sha256sum build/libs/*.jar > build/readiness-evidence/JAR_SHA256.txt
      - name: Six lifecycle checks including true source-conflict refusal
        run: |
          set -uo pipefail
          ns=catancraft_chunk_lifecycle
          mkdir -p build/$ns-run/config/catancraft/schematics
          cp tests/fixtures/thall4.schem tests/fixtures/thall5.schem build/$ns-run/config/catancraft/schematics/
          status=0
          timeout 600s gradle runGameTestServer -PgameTestNamespace=$ns --daemon --max-workers=4 > build/readiness-evidence/$ns.log 2>&1 || status=$?
          echo "$status" > build/readiness-evidence/$ns.exit
          cat build/readiness-evidence/$ns.log
          test "$status" = 0 && grep -Fq '6 GAME TESTS COMPLETE' build/readiness-evidence/$ns.log && grep -Fq 'All 6 required tests passed' build/readiness-evidence/$ns.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-readiness-final
          path: |
            build/libs/*.jar
            build/readiness-evidence/
          if-no-files-found: error
