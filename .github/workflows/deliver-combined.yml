name: Deliver verified CatanCraft 0.1.28 draft
on:
  push:
    branches: [codex/deliver-0.1.28]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested release bytes
        working-directory: .delivery/0.1.28
        run: sha256sum -c SHA256SUMS.txt
      - name: Retain downloadable delivery files
        uses: actions/upload-artifact@v4
        with:
          name: CatanCraft-0.1.28-verified-release
          path: .delivery/0.1.28/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Create draft release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Refuse collisions; never replace an existing release or publish a draft.
          tag=v0.1.28-review-a72e7b0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release tag already exists; retained artifact remains downloadable for review.'
            exit 1
          fi
          gh release create "$tag" \
            .delivery/0.1.28/catancraft-0.1.28.jar \
            .delivery/0.1.28/COMBINED_INGAME_CHECKLIST.md \
            .delivery/0.1.28/CatanCraft-0.1.28-combined.zip \
            .delivery/0.1.28/SHA256SUMS.txt \
            --draft \
            --target a72e7b075235271ab23fe5ca78c9bbd91d918c92 \
            --title 'CatanCraft 0.1.28 — combined review build' \
            --notes-file .delivery/0.1.28/release-notes.md
