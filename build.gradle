plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.45-economy-bays'
group = 'com.quin.catancraft'

base {
    archivesName = 'catancraft'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def gameTestNamespace = providers.gradleProperty('gameTestNamespace').orElse('catancraft').get()
def controlledGameTests = providers.gradleProperty('controlledGameTests').orElse('false').get().toBoolean()
def native43RestartPhase = providers.gradleProperty('native43RestartPhase').orElse('').get()
def native43RestartSource = providers.gradleProperty('native43RestartSource').orElse('').get()
def native43RestartProvider = providers.gradleProperty('native43RestartProvider').orElse('').get()
if (gameTestNamespace in ['catancraft_native43_tacz_restart', 'catancraft_native43_sbw_restart']) {
    def expectedProvider = gameTestNamespace == 'catancraft_native43_tacz_restart' ? 'tacz' : 'superbwarfare'
    if (!controlledGameTests || !(native43RestartPhase in ['seed', 'verify']) || !(native43RestartSource ==~ /[0-9a-f]{40}/) || native43RestartProvider != expectedProvider)
        throw new GradleException('Claim43 restart needs its controlled world, seed|verify, exact source SHA and matching provider')
}
def native42RestartPhase = providers.gradleProperty('native42RestartPhase').orElse('').get()
def native42RestartSource = providers.gradleProperty('native42RestartSource').orElse('').get()
def native42RestartProvider = providers.gradleProperty('native42RestartProvider').orElse('').get()
if (gameTestNamespace in ['catancraft_native42_tacz_restart', 'catancraft_native42_sbw_restart']) {
    def expectedProvider = gameTestNamespace == 'catancraft_native42_tacz_restart' ? 'tacz' : 'superbwarfare'
    if (!controlledGameTests || !(native42RestartPhase in ['seed', 'verify']) || !(native42RestartSource ==~ /[0-9a-f]{40}/) || native42RestartProvider != expectedProvider)
        throw new GradleException('Native42 restart needs its controlled world, seed|verify, exact source SHA and matching provider')
}
def rewardsRestartPhase = providers.gradleProperty('rewardsRestartPhase').orElse('').get()
def rewardsRestartSource = providers.gradleProperty('rewardsRestartSource').orElse('').get()
if (gameTestNamespace == 'catancraft_rewards41_restart' && (!controlledGameTests || !(rewardsRestartPhase in ['seed', 'verify']) || !(rewardsRestartSource ==~ /[0-9a-f]{40}/))) {
    throw new GradleException('Reward restart requires controlledGameTests=true, rewardsRestartPhase=seed|verify and exact rewardsRestartSource')
}
def shopRestartPhase = providers.gradleProperty('shopRestartPhase').orElse('').get()
def shopRestartSource = providers.gradleProperty('shopRestartSource').orElse('').get()
if (gameTestNamespace == 'catancraft_shop40_restart' && (!controlledGameTests || !(shopRestartPhase in ['seed', 'verify']) || !(shopRestartSource ==~ /[0-9a-f]{40}/))) {
    throw new GradleException('Shop restart requires controlledGameTests=true, shopRestartPhase=seed|verify and exact shopRestartSource')
}
def snapshotRestartPhase = providers.gradleProperty('snapshotRestartPhase').orElse('').get()
if (gameTestNamespace == 'catancraft_snapshot39_restart' && (!controlledGameTests || !(snapshotRestartPhase in ['seed', 'verify']))) {
    throw new GradleException('Snapshot restart test requires controlledGameTests=true and snapshotRestartPhase=seed|verify')
}
def siegeRestartPhase = providers.gradleProperty('siegeRestartPhase').orElse('').get()
if (gameTestNamespace == 'catancraft_session38_restart' && (!controlledGameTests || !(siegeRestartPhase in ['seed', 'verify']))) {
    throw new GradleException('Siege restart test requires controlledGameTests=true and siegeRestartPhase=seed|verify')
}
def sbwRestartPhase = providers.gradleProperty('sbwRestartPhase').orElse('').get()
if (gameTestNamespace == 'catancraft_sbw_procurement35' && (!controlledGameTests || !(sbwRestartPhase in ['seed', 'verify']))) {
    throw new GradleException('SEC-01 restart test requires controlledGameTests=true and sbwRestartPhase=seed|verify')
}
if (!(gameTestNamespace ==~ /[a-z0-9_]+/)) throw new GradleException('Invalid GameTest namespace')
def contractTestDirectory = project.file("build/controlled-${gameTestNamespace}-run")
// Isolated generated flat fixture only; production world names are unchanged.
def contractWorldName = gameTestNamespace == 'catancraft_startup34' ? 'CatanCraft_Season1_R7_Development' : 'world'

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                catancraft {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
        gameTestServer {
            workingDirectory controlledGameTests ? contractTestDirectory : project.file(gameTestNamespace == 'catancraft' ? 'build/gametest-run' : gameTestNamespace == 'catancraft_public27' ? 'build/public-gametest-run' : "build/${gameTestNamespace}-run")
            property 'forge.enabledGameTestNamespaces', gameTestNamespace
            if (gameTestNamespace in ['catancraft_native43_tacz_restart', 'catancraft_native43_sbw_restart']) {
                property 'catancraft.native43RestartPhase', native43RestartPhase
                property 'catancraft.native43RestartSource', native43RestartSource
                property 'catancraft.native43RestartProvider', native43RestartProvider
            }
            if (gameTestNamespace in ['catancraft_native42_tacz_restart', 'catancraft_native42_sbw_restart']) {
                property 'catancraft.native42RestartPhase', native42RestartPhase
                property 'catancraft.native42RestartSource', native42RestartSource
                property 'catancraft.native42RestartProvider', native42RestartProvider
            }
            if (gameTestNamespace == 'catancraft_rewards41_restart') {
                property 'catancraft.rewardsRestartPhase', rewardsRestartPhase
                property 'catancraft.rewardsRestartSource', rewardsRestartSource
            }
            if (gameTestNamespace == 'catancraft_shop40_restart') {
                property 'catancraft.shopRestartPhase', shopRestartPhase
                property 'catancraft.shopRestartSource', shopRestartSource
            }
            if (gameTestNamespace == 'catancraft_snapshot39_restart') property 'catancraft.snapshotRestartPhase', snapshotRestartPhase
            if (gameTestNamespace == 'catancraft_session38_restart') property 'catancraft.siegeRestartPhase', siegeRestartPhase
            if (gameTestNamespace == 'catancraft_sbw_procurement35') property 'catancraft.sbwRestartPhase', sbwRestartPhase
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

// Tell Forge ModLauncher to apply the optional Superb Warfare compatibility mixin.
tasks.named('jar', Jar).configure {
    manifest {
        attributes('MixinConfigs': 'catancraft.mixins.json')
        if (providers.gradleProperty('releaseCommit').isPresent()) {
            attributes('CatanCraft-Source-Commit': providers.gradleProperty('releaseCommit').get())
        }
    }
}


// New integration tests use a separate namespace/world so old test-batch geometry
// and entity state cannot contaminate unrelated fixtures. Template bytes are identical.
tasks.named('processResources', ProcessResources).configure {
    from('src/main/resources/data/catancraft/structures') {
        include 'townhall_state_empty.nbt'
        into 'data/catancraft_public27/structures'
    }
}

// Immutable prestige revisions are bundled independently of user configuration.
// R1 fixtures remain unchanged; R2 voxel plans are verified against the delivered full-state fingerprints.
tasks.named('processResources', ProcessResources).configure {
    from('tests/fixtures') {
        include 'thall4.schem', 'thall5.schem'
        into 'data/catancraft/townhall_revisions'
    }
}

// Integration native tests run in a third disposable namespace/world, retaining both suites.
tasks.named('processResources', ProcessResources).configure {
    ['catancraft_economy45','catancraft_vehicle45','catancraft_active44','catancraft_handheld44','catancraft_supply43','catancraft_claims43','catancraft_claims43_tacz','catancraft_claims43_sbw','catancraft_native43_tacz_restart','catancraft_native43_sbw_restart','catancraft_terrain43','catancraft_stock42','catancraft_native42_combined','catancraft_native42_tacz','catancraft_native42_sbw','catancraft_native42_tacz_restart','catancraft_native42_sbw_restart','catancraft_rewards41','catancraft_rewards41_restart','catancraft_shop40','catancraft_shop40_restart','catancraft_snapshot39','catancraft_snapshot39_restart','catancraft_session38','catancraft_session38_restart','catancraft_objectives37','catancraft_siege36','catancraft_gate35','catancraft_sbw_procurement35','catancraft_producer_source34','catancraft_startup34','catancraft_basic_natural34','catancraft_construction34','catancraft_producer_stability','catancraft_paid_recovery','catancraft_base_lifecycle','catancraft_economy_clock','catancraft_chunk_lifecycle','catancraft_wall_gui','catancraft_integration','catancraft_defense','catancraft_producer_r2','catancraft_houses','catancraft_sectors','catancraft_sectors_service','catancraft_sectors_p1','catancraft_sbw','catancraft_north_p2','catancraft_reservation_verifier','catancraft_sector_prices','catancraft_city_a_p3','catancraft_sector_connections','catancraft_sectors_natural','catancraft_sectors_group_proof','catancraft_city_a_group','catancraft_r7_production'].each { ns ->
        from('src/main/resources/data/catancraft/structures') {
            include 'townhall_state_empty.nbt'
            into "data/${ns}/structures"
        }
    }
}

// Stable archive ordering makes release checksums independently reviewable.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Synthetic construction fixtures must not be excavated into a random normal
// world's gravel/aquifers. Opt-in and separate build paths preserve authored-world
// tests and all real servers. Refuse an unrecognized existing save; never delete it.
def prepareContractGameTestWorld = tasks.register('prepareContractGameTestWorld') {
    onlyIf { controlledGameTests }
    outputs.upToDateWhen { false }
    doLast {
        def marker = new File(contractTestDirectory, '.catancraft-controlled-fixture-v1')
        def signature = 'CatanCraft synthetic flat fixture v1\n'
        def level = new File(contractTestDirectory, "${contractWorldName}/level.dat")
        if (level.exists() && (!marker.isFile() || marker.text != signature)) {
            throw new GradleException('Unrecognized existing GameTest save; use a new build directory. No files removed.')
        }
        def settings = [
            'level-name': contractWorldName,
            'level-type': 'minecraft:flat',
            'level-seed': '0',
            'generate-structures': 'false',
            'generator-settings': '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","lakes":false,"features":false,"structure_overrides":[]}'
        ]
        contractTestDirectory.mkdirs()
        def propertiesFile = new File(contractTestDirectory, 'server.properties')
        if (propertiesFile.exists()) {
            def previous = new Properties()
            propertiesFile.withInputStream { previous.load(it) }
            settings.each { key, value ->
                if (previous.getProperty(key) != value) throw new GradleException('GameTest settings changed: ' + key + '; refusing to replace existing fixture.')
            }
        } else {
            if (level.exists()) throw new GradleException('Existing fixture lost its properties; no automatic replacement.')
            propertiesFile.text = settings.collect { key, value -> key + '=' + value }.join('\n') + '\n'
        }
        if (!marker.exists()) marker.text = signature
        def schematics = new File(contractTestDirectory, 'config/catancraft/schematics')
        schematics.mkdirs()
        ['thall4.schem', 'thall5.schem'].each { name ->
            def source = project.file('tests/fixtures/' + name)
            def destination = new File(schematics, name)
            if (destination.exists() && !Arrays.equals(source.bytes, destination.bytes)) throw new GradleException('Changed GameTest schematic: ' + name)
            if (!destination.exists()) destination.bytes = source.bytes
        }
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareContractGameTestWorld }
