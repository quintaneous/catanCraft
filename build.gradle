plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.34-construction-safety'
group = 'com.quin.catancraft'

base {
    archivesName = 'catancraft'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def gameTestNamespace = providers.gradleProperty('gameTestNamespace').orElse('catancraft').get()
def controlledGameTests = providers.gradleProperty('controlledGameTests').orElse('false').get().toBoolean()
if (!(gameTestNamespace ==~ /[a-z0-9_]+/)) throw new GradleException('Invalid GameTest namespace')
def contractTestDirectory = project.file("build/controlled-${gameTestNamespace}-run")
// Isolated generated flat fixture only; production world names are unchanged.
def contractWorldName = gameTestNamespace == 'catancraft_startup34' ? 'CatanCraft_Season1_R7_Development' : 'world'

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                catancraft {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
        gameTestServer {
            workingDirectory controlledGameTests ? contractTestDirectory : project.file(gameTestNamespace == 'catancraft' ? 'build/gametest-run' : gameTestNamespace == 'catancraft_public27' ? 'build/public-gametest-run' : "build/${gameTestNamespace}-run")
            property 'forge.enabledGameTestNamespaces', gameTestNamespace
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

// Tell Forge ModLauncher to apply the optional Superb Warfare compatibility mixin.
tasks.named('jar', Jar).configure {
    manifest {
        attributes('MixinConfigs': 'catancraft.mixins.json')
        if (providers.gradleProperty('releaseCommit').isPresent()) {
            attributes('CatanCraft-Source-Commit': providers.gradleProperty('releaseCommit').get())
        }
    }
}


// New integration tests use a separate namespace/world so old test-batch geometry
// and entity state cannot contaminate unrelated fixtures. Template bytes are identical.
tasks.named('processResources', ProcessResources).configure {
    from('src/main/resources/data/catancraft/structures') {
        include 'townhall_state_empty.nbt'
        into 'data/catancraft_public27/structures'
    }
}

// Immutable prestige revisions are bundled independently of user configuration.
// R1 fixtures remain unchanged; R2 voxel plans are verified against the delivered full-state fingerprints.
tasks.named('processResources', ProcessResources).configure {
    from('tests/fixtures') {
        include 'thall4.schem', 'thall5.schem'
        into 'data/catancraft/townhall_revisions'
    }
}

// Integration native tests run in a third disposable namespace/world, retaining both suites.
tasks.named('processResources', ProcessResources).configure {
    ['catancraft_producer_source34','catancraft_startup34','catancraft_basic_natural34','catancraft_construction34','catancraft_producer_stability','catancraft_paid_recovery','catancraft_base_lifecycle','catancraft_economy_clock','catancraft_chunk_lifecycle','catancraft_wall_gui','catancraft_integration','catancraft_defense','catancraft_producer_r2','catancraft_houses','catancraft_sectors','catancraft_sectors_service','catancraft_sectors_p1','catancraft_sbw','catancraft_north_p2','catancraft_reservation_verifier','catancraft_sector_prices','catancraft_city_a_p3','catancraft_sector_connections','catancraft_sectors_natural','catancraft_sectors_group_proof','catancraft_city_a_group','catancraft_r7_production'].each { ns ->
        from('src/main/resources/data/catancraft/structures') {
            include 'townhall_state_empty.nbt'
            into "data/${ns}/structures"
        }
    }
}

// Stable archive ordering makes release checksums independently reviewable.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Synthetic construction fixtures must not be excavated into a random normal
// world's gravel/aquifers. Opt-in and separate build paths preserve authored-world
// tests and all real servers. Refuse an unrecognized existing save; never delete it.
def prepareContractGameTestWorld = tasks.register('prepareContractGameTestWorld') {
    onlyIf { controlledGameTests }
    outputs.upToDateWhen { false }
    doLast {
        def marker = new File(contractTestDirectory, '.catancraft-controlled-fixture-v1')
        def signature = 'CatanCraft synthetic flat fixture v1\n'
        def level = new File(contractTestDirectory, "${contractWorldName}/level.dat")
        if (level.exists() && (!marker.isFile() || marker.text != signature)) {
            throw new GradleException('Unrecognized existing GameTest save; use a new build directory. No files removed.')
        }
        def settings = [
            'level-name': contractWorldName,
            'level-type': 'minecraft:flat',
            'level-seed': '0',
            'generate-structures': 'false',
            'generator-settings': '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","lakes":false,"features":false,"structure_overrides":[]}'
        ]
        contractTestDirectory.mkdirs()
        def propertiesFile = new File(contractTestDirectory, 'server.properties')
        if (propertiesFile.exists()) {
            def previous = new Properties()
            propertiesFile.withInputStream { previous.load(it) }
            settings.each { key, value ->
                if (previous.getProperty(key) != value) throw new GradleException('GameTest settings changed: ' + key + '; refusing to replace existing fixture.')
            }
        } else {
            if (level.exists()) throw new GradleException('Existing fixture lost its properties; no automatic replacement.')
            propertiesFile.text = settings.collect { key, value -> key + '=' + value }.join('\n') + '\n'
        }
        if (!marker.exists()) marker.text = signature
        def schematics = new File(contractTestDirectory, 'config/catancraft/schematics')
        schematics.mkdirs()
        ['thall4.schem', 'thall5.schem'].each { name ->
            def source = project.file('tests/fixtures/' + name)
            def destination = new File(schematics, name)
            if (destination.exists() && !Arrays.equals(source.bytes, destination.bytes)) throw new GradleException('Changed GameTest schematic: ' + name)
            if (!destination.exists()) destination.bytes = source.bytes
        }
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareContractGameTestWorld }
